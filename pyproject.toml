[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-evolve"
version = "0.7.0"
description = "A research harness for AI-driven mathematical discovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ResearchEvolve contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research-evolve = "research_evolve.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_evolve*"]
