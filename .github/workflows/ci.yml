name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: |
          research-evolve run \
            --spec examples/target42/spec.json \
            --evaluator examples/target42/evaluator.py \
            --seeds examples/target42/seeds.json \
            --workspace .researchevolve/ci-target42 \
            --islands 2
          research-evolve manifest --workspace .researchevolve/ci-target42
